# Render Blueprint: New > Blueprint > pick this repo
databases:
  - name: jobtracker-db
    plan: free
    databaseName: jobtracker

services:
  - type: web
    name: jobtracker-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jobtracker-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # set to your frontend URL after it is created
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

  - type: web
    name: jobtracker-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # e.g. https://jobtracker-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
